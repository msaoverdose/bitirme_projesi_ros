<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROS WebSocket Test</title>
  <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
</head>
<body>
  <h1>Web Bağlantı Testi</h1>
  <p id="status">Bağlanıyor...</p>
  <pre id="output"></pre>
  <button id="startNavigation" disabled>Start Navigation</button>

  <script>
    const ros = new ROSLIB.Ros({
      url: 'ws://localhost:9090'
    });

    ros.on('connection', () => {
      document.getElementById('status').innerText = 'Connection established';
      document.getElementById('startNavigation').disabled = false;

      const mapTopic = new ROSLIB.Topic({
        ros: ros,
        name: '/map',
        messageType: 'nav_msgs/OccupancyGrid'
      });

      mapTopic.subscribe((message) => {
        document.getElementById('output').innerText = JSON.stringify(message, null, 2);
      });
    });

    ros.on('error', (error) => {
      document.getElementById('status').innerText = 'Connection ERROR!';
      console.error(error);
    });

    ros.on('close', () => {
      document.getElementById('status').innerText = 'Connection Closed!';
      document.getElementById('startNavigation').disabled = true;
    });

    // Start Navigation Button
    document.getElementById('startNavigation').addEventListener('click', () => {
      const startNavigationService = new ROSLIB.Service({
        ros: ros,
        name: '/start_navigation',
        serviceType: 'std_srvs/Trigger'
      });

      const request = new ROSLIB.ServiceRequest();

      startNavigationService.callService(request, (result) => {
        if (result.success) {
          alert('Navigation started successfully!');
        } else {
          alert('Failed to start navigation: ' + result.message);
        }
      });
    });
  </script>
</body>
</html>
